[package]
name = "sc-plotter-wasm"
version = "0.0.0"
authors = ["MultiversX <contact@multiversx.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/multiversx/mx-sdk-rs"
description = "Web app for displaying function graphs from the framework"
edition = "2024"
publish = false

[lib]
crate-type=["cdylib"]

[dependencies]
plotters = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
plotters-canvas = "0.3"

[profile.release]
lto = true

[dependencies.multiversx-sc]
version = "=0.66.2"
path = "../../framework/base"

[dependencies.multiversx-sc-scenario]
version = "=0.66.2"
path = "../../framework/scenario"
default-features = false

[workspace]
members = ["."]

[patch.crates-io]
multiversx-chain-vm-executor = { git = "https://github.com/ShanmugavardhanK/mx-vm-executor-rs", rev = "bb2e51477766fce9f794a512a208f851f1e0aaba" }
multiversx-chain-vm-executor-wasmer-experimental = { git = "https://github.com/ShanmugavardhanK/mx-vm-executor-rs", rev = "bb2e51477766fce9f794a512a208f851f1e0aaba" }
